<style>
  :root { --main:#2a8c8c; --main-dark:#1f6e6e; --bg:#ffffff; --text:#223; --line:#d8e4e4; --warn:#c0392b; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin:0; font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; background:var(--bg); color:var(--text); }
  .hidden { display:none !important; }
  #login-view { max-width: 420px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 20px; }
  label { display:block; font-size:14px; margin:12px 0 4px; }
  input { width:100%; font-size:16px; padding:12px; border:1px solid var(--line); border-radius:8px; }
  button { font-size:16px; border:0; border-radius:12px; padding:14px; cursor:pointer; }
  button.primary { background:var(--main); color:#fff; width:100%; margin-top:16px; }
  .msg { margin-top:12px; font-size:15px; min-height:22px; text-align:center; color:var(--warn); }
  #qr-view { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2.5vmin; padding:2vmin; }
  #clinic { font-size: 4.5vmin; font-weight: 700; color: var(--main-dark); }
  #qr-box { background:#fff; padding:2.5vmin; border:1px solid var(--line); border-radius:3vmin; line-height:0; }
  #qr-box canvas, #qr-box img { display:block; }
  #guide { font-size: 3.4vmin; text-align:center; }
  #bar { width: 62vmin; max-width: 90vw; height: 1.2vmin; background:#e3eeee; border-radius: 1vmin; overflow:hidden; }
  #bar-fill { height:100%; width:100%; background:var(--main); transition: width 1s linear; }
  #count { font-size: 3vmin; color:#567; font-variant-numeric: tabular-nums; }
  #qr-msg { font-size: 3vmin; color:var(--warn); min-height: 4vmin; text-align:center; }
</style>
</head>
<body>
<section id="login-view" class="hidden">
  <h1>院内QR表示</h1>
  <p>この画面は、院内のタブレットなどに、常時表示するためのものです。</p>
  <label for="email">メールアドレス</label>
  <input id="email" type="email" autocomplete="username">
  <label for="password">パスワード</label>
  <input id="password" type="password" autocomplete="current-password">
  <button id="login-btn" class="primary">ログイン</button>
  <div id="login-msg" class="msg"></div>
</section>

<section id="qr-view" class="hidden">
  <div id="clinic">エスポワール歯科</div>
  <div id="qr-box"><div id="qr"></div></div>
  <div id="guide">スマートフォンのカメラで、読み取ってください</div>
  <div id="bar"><div id="bar-fill"></div></div>
  <div id="count"></div>
  <div id="qr-msg"></div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="config.js"></script>
<script src="qr.js"></script>
</body>
</html>
