<style>
  :root { --main:#2a8c8c; --main-dark:#1f6e6e; --bg:#f4f8f8; --text:#223; --line:#d8e4e4; --warn:#c0392b; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; background:var(--bg); color:var(--text); }
  main { max-width: 960px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 8px 0 16px; }
  h2 { font-size: 16px; margin: 16px 0 8px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; overflow-x:auto; }
  label { display:block; font-size:14px; margin:12px 0 4px; }
  input, select { font-size:16px; padding:10px; border:1px solid var(--line); border-radius:8px; }
  #email, #password { width:100%; }
  button { font-size:16px; border:0; border-radius:10px; padding:10px 14px; cursor:pointer; }
  button.primary { background:var(--main); color:#fff; width:100%; margin-top:16px; padding:14px; }
  button.link { background:none; color:var(--main-dark); }
  .tabs { display:flex; gap:8px; margin-bottom:16px; }
  .tab { background:#e3eeee; color:var(--main-dark); flex:1; }
  .tab.active { background:var(--main); color:#fff; }
  .counts { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px; }
  .count { background:#eef6f6; border-radius:10px; padding:10px; text-align:center; }
  .count b { display:block; font-size:24px; color:var(--main-dark); }
  .msg { margin-top:12px; font-size:15px; min-height:22px; text-align:center; }
  .msg.err { color:var(--warn); }
  table { width:100%; border-collapse:collapse; font-size:14px; min-width:560px; }
  th, td { padding:8px 6px; border-bottom:1px solid var(--line); text-align:center; white-space:nowrap; }
  th { font-weight:600; color:#567; }
  td.left, th.left { text-align:left; }
  .flag { color:var(--warn); font-weight:bold; }
  .nav { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
  .qrs { border-radius:10px; padding:10px 12px; margin-bottom:12px; font-size:15px; font-weight:600; background:#eef6f6; color:#567; }
  .qrs.ok { background:#e2f4ea; color:#1e7a46; }
  .qrs.ng { background:#fdeaea; color:var(--warn); }
  .hidden { display:none; }
  .note { font-size:12px; color:#789; }
  select, textarea { font-family:inherit; background:#fff; }
  textarea { width:100%; font-size:16px; padding:10px; border:1px solid var(--line); border-radius:8px; }
  button.sm { font-size:14px; padding:8px 12px; margin:2px; }
  button.ok { background:var(--main); color:#fff; }
  button.ng { background:#fdeaea; color:var(--warn); }
  .badge { display:inline-block; min-width:20px; padding:0 6px; margin-left:4px; border-radius:10px; background:var(--warn); color:#fff; font-size:13px; line-height:20px; }
  td.wrap { white-space:normal; text-align:left; min-width:120px; }
  .st-approved { color:var(--main-dark); font-weight:600; }
  .st-rejected { color:var(--warn); font-weight:600; }
</style>
</head>
<body>
<main>
  <section id="login-view" class="hidden" style="max-width:520px;margin:0 auto">
    <h1>エスポワール歯科 勤怠管理(管理者)</h1>
    <div class="card">
      <label for="email">メールアドレス</label>
      <input id="email" type="email" autocomplete="username">
      <label for="password">パスワード</label>
      <input id="password" type="password" autocomplete="current-password">
      <button id="login-btn" class="primary">ログイン</button>
      <div id="login-msg" class="msg err"></div>
    </div>
  </section>

  <section id="app-view" class="hidden">
    <div class="nav">
      <h1>エスポワール歯科 勤怠管理(管理者)</h1>
      <button id="logout-btn" class="link">ログアウト</button>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="today">本日</button>
      <button class="tab" data-tab="day">日別</button>
      <button class="tab" data-tab="month">月別</button>
      <button class="tab" data-tab="corr">修正申請<span id="corr-badge" class="badge hidden">0</span></button>
    </div>
    <div id="app-msg" class="msg err"></div>

    <section id="tab-today">
      <div class="card">
        <div id="qr-status" class="qrs">QR表示:確認中…</div>
        <div class="counts">
          <div class="count">未出勤<b id="c-none">0</b></div>
          <div class="count">勤務中<b id="c-working">0</b></div>
          <div class="count">退勤済み<b id="c-done">0</b></div>
        </div>
        <table>
          <thead><tr><th class="left">スタッフ</th><th>状態</th><th>出勤</th><th>退勤</th></tr></thead>
          <tbody id="today-body"></tbody>
        </table>
      </div>
    </section>

    <section id="tab-day" class="hidden">
      <div class="card">
        <div class="row">
          <label for="day-input" style="margin:0">日付</label>
          <input id="day-input" type="date">
        </div>
        <table>
          <thead><tr><th class="left">スタッフ</th><th>出勤</th><th>退勤</th><th>勤務時間</th><th>状況</th></tr></thead>
          <tbody id="day-body"></tbody>
        </table>
        <p class="note">過去の日で、出勤か退勤などが欠けている場合は「打刻漏れ」と表示されます。</p>
      </div>
    </section>

    <section id="tab-month" class="hidden">
      <div class="card">
        <div class="nav">
          <button id="prev-month" class="link">◀ 前の月</button>
          <strong id="month-label"></strong>
          <button id="next-month" class="link">次の月 ▶</button>
        </div>
        <h2>スタッフ別の合計</h2>
        <table>
          <thead><tr><th class="left">スタッフ</th><th>出勤日数</th><th>勤務時間の合計</th><th>打刻漏れ</th></tr></thead>
          <tbody id="month-summary"></tbody>
        </table>
      </div>
      <div class="card">
        <div class="row">
          <label for="staff-select" style="margin:0">スタッフ</label>
          <select id="staff-select"></select>
        </div>
        <table>
          <thead><tr><th>日</th><th>出勤</th><th>退勤</th><th>休憩</th><th>勤務</th><th>状況</th></tr></thead>
          <tbody id="month-detail"></tbody>
        </table>
      </div>
    </section>

    <section id="tab-corr" class="hidden">
      <div class="card">
        <h2 style="margin-top:0">申請中</h2>
        <table>
          <thead><tr><th class="left">スタッフ</th><th>日付</th><th>種類</th><th>時刻</th><th class="left">理由</th><th>処理</th></tr></thead>
          <tbody id="corr-pending"></tbody>
        </table>
        <p class="note">時刻は、承認の前に直せます。出勤は一番早い時刻、退勤は一番遅い時刻が、勤務時間の計算に使われます。</p>
      </div>
      <div class="card">
        <h2 style="margin-top:0">管理者が直接追加する</h2>
        <div class="row">
          <select id="add-staff"></select>
          <input id="add-date" type="date">
          <select id="add-type"><option value="clock_in">出勤</option><option value="clock_out">退勤</option></select>
          <input id="add-time" type="time">
        </div>
        <textarea id="add-note" maxlength="300" placeholder="理由(必須)。例:本人に確認、朝の打刻漏れ"></textarea>
        <button id="add-btn" class="primary">追加する</button>
        <div id="add-msg" class="msg"></div>
      </div>
      <div class="card">
        <h2 style="margin-top:0">処理済み(直近30件)</h2>
        <table>
          <thead><tr><th class="left">スタッフ</th><th>日付</th><th>種類</th><th>時刻</th><th>結果</th><th class="left">処理した人</th></tr></thead>
          <tbody id="corr-done"></tbody>
        </table>
      </div>
    </section>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
